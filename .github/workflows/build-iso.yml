name: Build Null OS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build-full.log
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: null-os-iso
          path: |
            *.iso
            *.sha256
          retention-days: 14
          compression-level: 0
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Publish build log to the build-logs branch
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/logs
          cp build.log build-full.log /tmp/logs/ 2>/dev/null
          [ -f build.log ] || cp build-full.log build.log
          grep -nE '^(E:|P: Begin|ERROR)|Unable to locate|no installation candidate|Traceback|[Ee]rror' build.log | tail -80 > /tmp/logs/errors.txt
          tail -300 build.log > /tmp/logs/tail.txt
          # Annotations are readable through the API even when log downloads aren't
          tail -6 build-full.log | while IFS= read -r line; do echo "::error title=build-output::${line:0:900}"; done
          tail -6 /tmp/logs/errors.txt | while IFS= read -r line; do echo "::error title=build-error::${line:0:900}"; done
          tail -4 /tmp/logs/tail.txt | while IFS= read -r line; do echo "::warning title=build-tail::${line:0:900}"; done
          apt-get install -y -qq git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git >/dev/null)
          cd /tmp/logs
          git init -q -b build-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Build log from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: null-os-iso
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 python3-pil
      - name: Boot ISO and take screenshots
        timeout-minutes: 20
        continue-on-error: true
        run: python3 tools/vm-screenshots.py *.iso shots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
      - name: Publish screenshots to the screenshots branch
        if: always()
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Null OS screenshots\n\nFrom build %s (%s)\n\n' "${GITHUB_SHA::7}" "$(date -u +%F)" > README.md
          for f in *.png; do printf '### %s\n![%s](%s)\n\n' "${f%.png}" "$f" "$f" >> README.md; done
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: null-os-iso
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            *.sha256
