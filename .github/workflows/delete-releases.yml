name: Delete releases

# Actions > Delete releases > Run workflow: removes old releases (their
# files and notes) and their tags. Refuses to touch the latest release.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to delete (e.g. 0.2 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Delete
        shell: bash
        run: |
          set -uo pipefail
          latest=$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null || true)
          for t in ${{ inputs.tags }}; do
            if [ "$t" = "$latest" ]; then
              echo "::error::$t is the latest release; not deleting it"; continue
            fi
            if gh release delete "$t" -R "$R" -y --cleanup-tag; then
              echo "::notice::deleted release and tag $t"
            elif gh release delete "$t" -R "$R" -y; then
              echo "::warning::deleted release $t (tag kept: $(gh api -X DELETE repos/$R/git/refs/tags/$t 2>&1 | head -c 200))"
            else
              echo "::error::could not delete $t"
            fi
          done
          echo "::notice::releases left: $(gh api repos/$R/releases --jq '[.[].tag_name] | join(", ")')"
