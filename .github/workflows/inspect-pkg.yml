name: Inspect a Debian package

# Prints files from a trixie package as annotations (logs can't be read from
# the Claude session). Actions > Inspect a Debian package > Run workflow.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name"
        required: true
      files:
        description: "Space-separated globs inside the package to print"
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Print files
        shell: bash
        run: |
          set -e
          apt-get update -qq
          for p in ${{ inputs.package }}; do
            f=$(apt-cache show "$p" 2>/dev/null | awk '/^Package:/{n++} n==1' | grep -E '^(Depends|Pre-Depends|Recommends|Suggests):' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=control $p::$f"
          done
          set -- ${{ inputs.package }}
          cd /tmp && apt-get download -qq "$1"
          dpkg-deb -x *.deb pkg
          echo "::notice::files: $(cd pkg && find . -type f | grep -E 'calamares|\.conf$' | tr '\n' ' ' | head -c 3500)"
          cd pkg
          for g in ${{ inputs.files }}; do
            for f in $g; do
              [ -f "$f" ] || continue
              # annotations are capped at ~4 KB; strip comments and blanks
              body=$(grep -vE '^\s*#|^\s*$' "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::notice title=$f::${body:0:3900}"
            done
          done
