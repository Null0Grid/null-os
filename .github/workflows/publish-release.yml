name: Publish release from a build

# Actions > Publish release > Run workflow: takes the ISO from an existing
# Build ISO run and attaches it to a GitHub release (no rebuild). Release
# files must be under 2 GiB, so a bigger ISO is attached in parts with
# instructions to join them.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build ISO run id to publish"
        required: true
      tag:
        description: "Release tag (e.g. v0.2)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: null-os-iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: iso
      - name: Split if over 2 GiB
        shell: bash
        run: |
          set -euo pipefail
          cd iso
          ISO=$(ls *.iso | head -1)
          ls -l
          sha256sum "$ISO" > "$ISO.sha256"
          SIZE=$(stat -c %s "$ISO")
          if [ "$SIZE" -ge 2147483648 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            rm "$ISO"
            echo "PARTS=yes" >> "$GITHUB_ENV"
          fi
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          ls -l
      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" --jq .head_sha)
          {
            echo "Null OS ${TAG#v}: Debian 13 (trixie), KDE Plasma 6, Neon Lab."
            echo
            echo "Includes Null Grid (browser), Null File (file manager) and NULL // PLAY (Gamer Mode: Super+G or \`gamemode\`)."
            echo
            if [ "${PARTS:-}" = yes ]; then
              echo "## Download"
              echo "GitHub limits release files to 2 GB, so the ISO comes in parts. Download every \`.part\` file into one folder, then join them:"
              echo
              echo "- **Windows** (Command Prompt): \`copy /b $ISO.part0 + $ISO.part1 $ISO\`"
              echo "- **Linux / macOS**: \`cat $ISO.part* > $ISO\`"
              echo
              echo "Check it against \`$ISO.sha256\` (Windows: \`certutil -hashfile $ISO SHA256\`)."
              echo
            fi
            echo "## VirtualBox"
            echo "Linux / Debian (64-bit), 4 GB RAM, 2+ CPUs, VMSVGA with 128 MB video memory, 3D off, 25 GB disk for the installer."
            echo
            echo "Built from $SHA (run ${{ inputs.run_id }})."
          } > notes.md
          # Re-publishing a tag replaces the old release and its files
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "${{ github.repository }}" -y
            sleep 5
          fi
          PRE=""
          # Use the tag if it already exists (pushed by hand): the workflow
          # token can't create a tag on a commit that changes workflows.
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TARGET=""
          else
            TARGET="--target $SHA"
          fi
          [ "${{ inputs.prerelease }}" = true ] && PRE="--prerelease"
          for try in 1 2 3; do
            if gh release create "$TAG" iso/* -R "${{ github.repository }}" \
                 $TARGET --title "Null OS ${TAG#v}" --notes-file notes.md $PRE 2> err.txt; then
              exit 0
            fi
            echo "::warning::release create try $try: $(tr '\n' ' ' < err.txt)"
            # A half-made release from a failed try is removed before retrying
            gh release delete "$TAG" -R "${{ github.repository }}" -y 2>/dev/null || true
            sleep 20
          done
          echo "::error::release create failed: $(tr '\n' ' ' < err.txt)"
          exit 1
