name: Publish release from a build

# Actions > Publish release > Run workflow: takes the ISO from an existing
# Build ISO run and attaches it to a GitHub release (no rebuild). Release
# files must be under 2 GiB, so a bigger ISO is attached in parts with
# instructions to join them.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build ISO run id to publish"
        required: true
      tag:
        description: "Release tag (e.g. 1.1.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: null-os-iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: iso
      - name: Split if over 2 GiB
        shell: bash
        run: |
          set -euo pipefail
          cd iso
          ISO=$(ls *.iso | head -1)
          ls -l
          sha256sum "$ISO" > "$ISO.sha256"
          SIZE=$(stat -c %s "$ISO")
          if [ "$SIZE" -ge 2147483648 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            rm "$ISO"
            echo "PARTS=yes" >> "$GITHUB_ENV"
          fi
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          ls -l
      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" --jq .head_sha)
          {
            echo "Null OS ${TAG#v}: Debian 13 (trixie), KDE Plasma 6, Neon Lab."
            echo
            echo "Includes Null Grid (browser), Null File (file manager) and NULL // PLAY (Gamer Mode: Super+G or \`gamemode\`)."
            echo
            if [ "${PARTS:-}" = yes ]; then
              echo "## Download"
              echo "GitHub limits release files to 2 GB, so the ISO comes in parts. Download every \`.part\` file into one folder, then join them:"
              echo
              echo "- **Windows** (Command Prompt): \`copy /b $ISO.part0 + $ISO.part1 $ISO\`"
              echo "- **Linux / macOS**: \`cat $ISO.part* > $ISO\`"
              echo
              echo "Check it against \`$ISO.sha256\` (Windows: \`certutil -hashfile $ISO SHA256\`)."
              echo
            fi
            echo "## VirtualBox"
            echo "Linux / Debian (64-bit), 4 GB RAM, 2+ CPUs, VMSVGA with 128 MB video memory, 3D off, 25 GB disk for the installer."
            echo
            echo "Built from $SHA (run ${{ inputs.run_id }})."
          } > notes.md
          R="${{ github.repository }}"
          # The workflow token can't create tags here (GitHub blocks it for
          # commits that touch workflows), so the release is made by hand in
          # the GitHub UI. If it exists, swap its files and notes.
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" -R "$R" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" -R "$R" -y
            done
            gh release edit "$TAG" -R "$R" --title "Null OS ${TAG#v}" --notes-file notes.md
            gh release upload "$TAG" iso/* -R "$R" --clobber
          else
            PRE=""
            [ "${{ inputs.prerelease }}" = true ] && PRE="--prerelease"
            if ! gh release create "$TAG" iso/* -R "$R" --target "$SHA" \
                   --title "Null OS ${TAG#v}" --notes-file notes.md $PRE 2> err.txt; then
              echo "::error::release create failed: $(tr '\n' ' ' < err.txt). Create release $TAG in the GitHub UI, then run this again."
              exit 1
            fi
          fi
