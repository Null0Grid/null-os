name: Screenshots only

# Re-run the VM screenshots against an ISO from an earlier build,
# without rebuilding it (saves ~20 minutes per check).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID whose ISO to boot"
        required: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: null-os-iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 python3-pil
      - name: Boot ISO and take screenshots
        run: python3 tools/vm-screenshots.py *.iso shots
      - name: Publish screenshots to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Null OS screenshots\n\nISO from build run %s, screenshots %s\n\n' "${{ inputs.run_id }}" "$(date -u +%F)" > README.md
          for f in *.png; do printf '### %s\n![%s](%s)\n\n' "${f%.png}" "$f" "$f" >> README.md; done
          git add -A
          git commit -q -m "Screenshots for run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
