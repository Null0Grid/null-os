# ---- Null OS build settings ----
DISTRO_NAME="Null OS"
DISTRO_ID="nullos"            # os-release ID, ISO file name
DISTRO_HOSTNAME="null"        # default hostname (prompt shows user<mark>null)
DISTRO_VERSION="1.2.1"
DEBIAN_SUITE="trixie"         # Debian 13
ARCH="${ARCH:-amd64}"          # amd64 or arm64 (ARCH=arm64 ./build.sh)
DESKTOP="1"                   # 1 = KDE Plasma desktop (default), 0 = CLI only
